[package]
name = "Joy Of Painting"
description = "The Joy of Painting Morrowind adds a new Painting skill which allows you to create your own paintings and sell them or hang them on a wall. "
repository = "https://github.com/jhaakma/joy-of-painting"
authors = [ "Merlord", "Greatness7", "Melchior Dahrk",]
version = "1.10.10"

[dependencies]
assets = [
    "TheJoyOfPainting.esp",
    "Icons\\jop",
    "Meshes\\jop",
    "Sound\\jop",
    "Textures\\jop",
    "Docs\\JoyOfPainting.md",
    "MWSE\\mods\\mer\\joyOfPainting",
    "shaders\\XEshaders\\jop_adjuster.fx",
    "shaders\\XEshaders\\jop_blackwhite.fx",
    "shaders\\XEshaders\\jop_charcoal.fx",
    "shaders\\XEshaders\\jop_common.fx",
    "shaders\\XEshaders\\jop_composite.fx",
    "shaders\\XEshaders\\jop_distort.fx",
    "shaders\\XEshaders\\jop_dof.fx",
    "shaders\\XEshaders\\jop_fog_bw.fx",
    "shaders\\XEshaders\\jop_fog_color.fx",
    "shaders\\XEshaders\\jop_gaussian.fx",
    "shaders\\XEshaders\\jop_greyscale.fx",
    "shaders\\XEshaders\\jop_hatch.fx",
    "shaders\\XEshaders\\jop_ink.fx",
    "shaders\\XEshaders\\jop_kuwahara.fx",
    "shaders\\XEshaders\\jop_lut.fx",
    "shaders\\XEshaders\\jop_mottle.fx",
    "shaders\\XEshaders\\jop_oil.fx",
    "shaders\\XEshaders\\jop_outline.fx",
    "shaders\\XEshaders\\jop_pastel.fx",
    "shaders\\XEshaders\\jop_quantize.fx",
    "shaders\\XEshaders\\jop_sharpen.fx",
    "shaders\\XEshaders\\jop_splash.fx",
    "shaders\\XEshaders\\jop_vignette.fx",
    "shaders\\XEshaders\\jop_watercolor.fx",
    "shaders\\XEshaders\\jop_window.fx",
]

[dependencies.mwse]
buildnumber = 4093

[dependencies.mge-xe]
version = ">=0.16.0"

[tools.mwse]
lua-mod = "mer.joyofpainting"

[dependencies.mods."Skills Module"]
mwse-module = "SkillsModule"
url = "https://www.nexusmods.com/morrowind/mods/46034?tab=files"
version = "^2.0.0"

[dependencies.mods."The Crafting Framework"]
mwse-module = "CraftingFramework"
version = "^1.30.0"
url = "https://www.nexusmods.com/morrowind/mods/51009?tab=files"
